services:
  portal:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCD_TOKEN: ${MCD_TOKEN:?Set MCD_TOKEN}
      MCD_DATA: ${MCD_HOST_DATA:?Set MCD_HOST_DATA}
      MCD_PUBLIC_HOST: ${MCD_PUBLIC_HOST:?Set MCD_PUBLIC_HOST}
      MCD_MAX_RAM_GB: ${MCD_MAX_RAM_GB:-12}
      CF_API_KEY: ${CF_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MCD_HOST_DATA:?Set MCD_HOST_DATA}:${MCD_HOST_DATA:?Set MCD_HOST_DATA}
