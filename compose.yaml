services:
  portal:
    build: .
    restart: unless-stopped
    ports:
      # Bind only to a specified host interface. Keep 127.0.0.1 by default;
      # set MCD_PORTAL_BIND_IP to your Linux server's LAN IPv4 for family access.
      # Never forward 8080 from the internet router.
      - "${MCD_PORTAL_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      MCD_TOKEN: ${MCD_TOKEN:?Set MCD_TOKEN}
      MCD_DATA: ${MCD_HOST_DATA:?Set MCD_HOST_DATA}
      MCD_PUBLIC_HOST: ${MCD_PUBLIC_HOST:?Set MCD_PUBLIC_HOST}
      MCD_MAX_RAM_GB: ${MCD_MAX_RAM_GB:-12}
      MCD_GAME_PORT: ${MCD_GAME_PORT:-25565}
      CF_API_KEY: ${CF_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MCD_HOST_DATA:?Set MCD_HOST_DATA}:${MCD_HOST_DATA:?Set MCD_HOST_DATA}
